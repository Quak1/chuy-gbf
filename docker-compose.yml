services:
  gbfapp:
    image: chuy-gbf:latest
    container_name: chuy-gbf
    restart: unless-stopped
    networks:
      - caddy_net
    volumes:
      - data:/data
    labels:
      caddy: gbf.hatvault.win
      caddy.request_body.max_size: 10MB
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.reverse_proxy.transport: http
      caddy.reverse_proxy.transport.read_timeout: 360s

volumes:
  data:

networks:
  caddy_net:
    external: true
